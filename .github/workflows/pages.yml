name: Publica o site no GitHub Pages

on:
  push:
    branches: [claude/site-html-js-piwo0j]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Um deploy por vez; não cancela o que já está no meio do caminho.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # PASSO MANUAL, UMA VEZ SÓ: o Pages precisa ser ligado à mão em
      # Settings › Pages › Source: "GitHub Actions". O token do workflow
      # publica, mas não tem permissão para criar o site do zero — sem
      # esse passo este job falha com "Resource not accessible by
      # integration". Depois de ligado, o enablement abaixo vira no-op e
      # todo push nesta branch republica sozinho.
      - name: Liga o Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # O site é estático e mora na raiz: sobe como está.
      - name: Empacota o site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publica
        id: deployment
        uses: actions/deploy-pages@v4
